    <main>
    
        <h4>Old Fashioned</h4>

        <p>Best enjoyed in a cut tumbler.</p>

        <p>Time: 5 minutes.</p>
        <h4>Ingredients</h4>
        <ul>
            <li>
                50ml whiskey
            </li>
            <li>
                25ml water
            </li>
            <li>
                1 teaspoon molasses sugar
            </li>
            <li>
                A dash of Angostura
            </li>
            <li>
                An ice cube
            </li>
        </ul>
        <h4>Preparation</h4>
        <ol>
            <li>
                Mix all ingredients together.
            </li>
            <li>
                Drink.
            </li>
        </ol>

    </main>
